name: build-lite

on:
  push:
    branches: [ lite ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes the running build; tag
# (release) builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  NDK_DIR: android-ndk-r23b
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
  # Package version: the tag name for releases, "nightly" otherwise.
  PKG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
  # Caches are written by the default branch only: tags and PRs can read
  # them, but what they would write is visible to themselves alone.
  SAVE_CACHE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  # Bump to collect the QEMU binaries bundled in the packages again.
  QEMU_BUNDLE_REV: '1'
  # Docker image built from the linux-x86_64 package (see the docker job).
  IMAGE: ghcr.io/${{ github.repository }}

# Runner images: `-latest` wherever the image does not end up in what we
# ship. Pinned on purpose: the Linux packages (the binary links the image's
# glibc, so a newer image would raise the minimum glibc for users, and the
# bundled QEMU libraries come from it) and the guest (its kernel is the
# image's /boot/vmlinuz).
jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Build web panel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  lite:
    name: Build lite (Android NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # cmake, make and unzip come with the runner image. Only the NDK's LLVM
      # toolchain (compilers + sysroot) is used, so only that is unpacked.
      - name: Download Android NDK r23b
        run: |
          curl -fsSL --retry 3 -o ndk.zip "$NDK_URL"
          unzip -q ndk.zip "$NDK_DIR/toolchains/llvm/*" && rm ndk.zip
      - name: Build lite
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      # A tarball keeps permissions (artifacts do not). Owner 0 so unpacking
      # as root does not leave files owned by the runner's uid; non-root
      # users get their own uid either way.
      - run: tar czf rootfs.tar.gz --owner=0 --group=0 --numeric-owner rootfs
      - uses: actions/upload-artifact@v7
        with:
          name: lite-rootfs
          path: rootfs.tar.gz

  guest:
    name: Build QEMU guest + native smoke test
    needs: lite
    runs-on: ubuntu-22.04  # pinned: the guest kernel comes from this image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lite-rootfs
      - run: tar xzf rootfs.tar.gz && rm rootfs.tar.gz
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build static wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --release --target x86_64-unknown-linux-musl -p wrapper
      - name: Smoke test the rootless sandbox and the native agent
        run: |
          W=target/x86_64-unknown-linux-musl/release/wrapper
          $W sandbox-exec --rootfs rootfs -- /system/bin/lite --help
          $W agent --rootfs rootfs --port 12399 &
          for i in $(seq 1 30); do curl -sf localhost:12399/status && break; sleep 1; done
          curl -sf localhost:12399/status | grep -q '"code":0'
          kill %1
      - name: Build guest image
        run: |
          apt-get download busybox-static
          chmod +x qemu/*.sh
          ./qemu/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: qemu-guest
          path: |
            qemu/vmlinuz-lite-qemu
            qemu/lite-initramfs.cpio.gz

  package:
    name: Package (${{ matrix.name }})
    needs: [ web, guest ]
    # PRs stop at the checks and the guest smoke test.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: pinned, the oldest supported image keeps the glibc floor low.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          - name: windows-x86_64
            os: windows-latest
          # No macOS package: GitHub's macOS arm64 runners were too scarce to
          # get one (jobs were dropped after 15 minutes in the queue). macOS
          # users run the Docker image.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v8
        with:
          name: qemu-guest
          path: dist/qemu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build wrapper
        run: cargo build --release -p wrapper

      # QEMU binary, firmware and libraries are collected into qemu-bundle/
      # once and cached: installing QEMU (apt / choco) is by far the
      # slowest part of a package build.
      - name: Restore QEMU bundle
        id: qemu-cache
        uses: actions/cache/restore@v6
        with:
          path: qemu-bundle
          key: qemu-bundle-${{ matrix.name }}-${{ env.QEMU_BUNDLE_REV }}
      - name: Install QEMU (Linux)
        if: runner.os == 'Linux' && steps.qemu-cache.outputs.cache-hit != 'true'
        # QEMU runs headless (-display none): no GUI, audio or extra block modules.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios ipxe-qemu
      - name: Install QEMU (Windows)
        if: runner.os == 'Windows' && steps.qemu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install qemu -y --no-progress
      - name: Collect QEMU binary and firmware (Linux)
        if: runner.os == 'Linux' && steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          B=qemu-bundle
          mkdir -p "$B"
          cp "$(command -v qemu-system-x86_64)" "$B/"
          cp -R /usr/share/qemu/. "$B/"
          cp -R /usr/share/seabios/. "$B/" || true
          cp -R /usr/lib/ipxe/qemu/. "$B/" || true
          # shared libraries (wrapper adds qemu/bin to LD_LIBRARY_PATH)
          ldd "$(command -v qemu-system-x86_64)" | awk '/=> \// {print $3}' | sort -u | \
            while read -r so; do cp -n "$so" "$B/"; done
          # accel/device modules (QEMU_MODULE_DIR points at qemu/bin)
          MODDIR="$(find /usr/lib /usr/lib64 -type f -name 'accel-*.so' 2>/dev/null | xargs -r dirname | sort -u | head -1 || true)"
          if [ -n "$MODDIR" ]; then cp -R "$MODDIR/." "$B/"; fi
      - name: Collect QEMU binary and firmware (Windows)
        if: runner.os == 'Windows' && steps.qemu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $q = Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue
          $qemuDir = if ($q) { Split-Path $q.Source } else {
            @('C:/Program Files/qemu', 'C:/ProgramData/chocolatey/bin') |
              Where-Object { Test-Path (Join-Path $_ 'qemu-system-x86_64.exe') } | Select-Object -First 1
          }
          if (-not $qemuDir) { Write-Error 'qemu-system-x86_64.exe not found'; exit 1 }
          $dst = 'qemu-bundle'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item (Join-Path $qemuDir 'qemu-system-x86_64.exe') $dst
          Get-ChildItem (Join-Path $qemuDir '*.dll') -File | ForEach-Object { Copy-Item $_.FullName $dst }
          $share = Join-Path $qemuDir 'share'
          if (Test-Path $share) { Copy-Item -Recurse -Force (Join-Path $share '*') $dst }
      # Never cache (or ship) a bundle without the emulator in it.
      - name: Check QEMU bundle
        shell: bash
        run: ls qemu-bundle/qemu-system-x86_64* && du -sh qemu-bundle
      - name: Save QEMU bundle
        if: steps.qemu-cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v6
        with:
          path: qemu-bundle
          key: ${{ steps.qemu-cache.outputs.cache-primary-key }}

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p dist/qemu/bin
          cp -R qemu-bundle/. dist/qemu/bin/
          cp README.md LICENSE dist/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/wrapper.exe dist/
          else
            cp target/release/wrapper dist/
          fi

      - name: Add the native rootfs (linux-x86_64)
        if: matrix.name == 'linux-x86_64'
        uses: actions/download-artifact@v8
        with:
          name: lite-rootfs
      - name: Unpack the native rootfs (linux-x86_64)
        if: matrix.name == 'linux-x86_64'
        run: tar xzf rootfs.tar.gz -C dist && rm rootfs.tar.gz

      # Archive here: artifacts drop the executable bit, tarballs keep it.
      - name: Archive package
        shell: bash
        run: |
          PKG="wrapper-$PKG_VERSION-${{ matrix.name }}"
          mv dist "$PKG"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          else
            OWNER=()  # GNU tar only; the rootfs ships in the Linux package
            [[ "${{ runner.os }}" == "Linux" ]] && OWNER=(--owner=0 --group=0 --numeric-owner)
            tar czf "$PKG.tar.gz" "${OWNER[@]}" "$PKG"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wrapper-${{ matrix.name }}
          path: |
            wrapper-*.tar.gz
            wrapper-*.zip
          compression-level: 0

  android:
    name: Package (android-aarch64) + APK
    needs: [ web, guest ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v8
        with:
          name: qemu-guest
          path: dist/qemu
      - name: Download Android NDK r23b
        run: |
          curl -fsSL --retry 3 -o ndk.zip "$NDK_URL"
          unzip -q ndk.zip "$NDK_DIR/toolchains/llvm/*" && rm ndk.zip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build wrapper for Android
        run: |
          TC="$PWD/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          cargo build --release --target aarch64-linux-android -p wrapper
      - name: Bundle Termux QEMU (binary, firmware, shared libraries)
        run: python3 android/bundle_termux_deps.py --target-dir dist/qemu/bin
      - name: Assemble package
        run: |
          cp target/aarch64-linux-android/release/wrapper dist/
          cp README.md LICENSE dist/
          PKG="wrapper-$PKG_VERSION-android-aarch64"
          tar czf "$PKG.tar.gz" --owner=0 --group=0 --numeric-owner --transform "s,^dist,$PKG," dist
      - uses: actions/upload-artifact@v7
        with:
          name: wrapper-android-aarch64
          path: wrapper-*.tar.gz
          compression-level: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/assets
          cp target/aarch64-linux-android/release/wrapper android/app/src/main/jniLibs/arm64-v8a/libwrapper.so
          cp -R dist/qemu android/app/src/main/assets/qemu
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-apk/wrapper-$PKG_VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: wrapper-android-apk
          path: dist-apk

  # ghcr.io/<owner>/wrapper from the linux-x86_64 package (nothing is compiled
  # again): `nightly` from the default branch; `<version>`, `<major>.<minor>`
  # and `latest` from release tags.
  docker:
    name: Docker image
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wrapper-linux-x86_64
      - name: Unpack the linux-x86_64 package
        run: |
          mkdir ctx
          tar xzf wrapper-*-linux-x86_64.tar.gz -C ctx --strip-components=1
          rm -rf ctx/qemu ctx/rootfs/data
          ls -l ctx
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ctx
          file: docker/prebuilt.Dockerfile
          load: true
          tags: wrapper:ci
      # Same container options as compose.yaml. The runner is Ubuntu 24.04,
      # whose AppArmor policy refuses user namespaces even to container root,
      # like many servers: the agent must pick the privileged sandbox.
      - name: Smoke test (agent up, lite starts in the container's sandbox)
        run: |
          docker run -d --name wrapper-ci --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -p 12399:12340 wrapper:ci
          for i in $(seq 1 30); do curl -sf localhost:12399/status && break; sleep 1; done
          curl -sf localhost:12399/status | grep -q '"code":0' || { docker logs wrapper-ci; exit 1; }
          docker logs wrapper-ci 2>&1 | tee agent.log
          grep -q 'lite runtime: privileged sandbox' agent.log
          docker exec wrapper-ci /app/wrapper sandbox-exec --privileged --rootfs /app/rootfs -- /system/bin/lite --help
          docker rm -f wrapper-ci
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=nightly,enable={{is_default_branch}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: ctx
          file: docker/prebuilt.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ check, package, android ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wrapper-*
          path: release
          merge-multiple: true
      # Components + manifest.json for `wrapper update`.
      - name: Build update manifest
        run: python3 scripts/release-manifest.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release
      # The key must match crates/host/update-key.pub, which the binaries
      # embed: a mismatch would make every `wrapper update` refuse.
      - name: Sign update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          EXPECTED="$(grep -v '^#' crates/host/update-key.pub | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if [ -z "$EXPECTED" ]; then
            echo "::warning::crates/host/update-key.pub has no key; publishing an unsigned manifest"
            exit 0
          fi
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::UPDATE_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          ACTUAL="$(openssl pkey -in "$RUNNER_TEMP/update-key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::UPDATE_SIGNING_KEY does not match update-key.pub"; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/update-key.pem" \
            -in release/manifest.json -out release/manifest.json.sig
          rm -f "$RUNNER_TEMP/update-key.pem"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          NOTES="../docs/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "wrapper $GITHUB_REF_NAME" --notes-file "$NOTES" \
            -- *
